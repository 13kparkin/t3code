name: agent-board

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Cut the release board-v<version>, such as 0.1.0. Leave empty to run the gates alone.
        type: string
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  agent-board:
    name: agent-board
    if: ${{ inputs.version == '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@agent-board/app...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Fetch upstream T3 Code
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags --filter=blob:none upstream main

      - name: Engine boundary
        run: node apps/board/scripts/check-engine-untouched.mjs

      - name: Standards
        run: node standards/check-added-diagnostics.mjs

      - name: Standards dependency rules
        run: vp run --filter @agent-board/app standards:deps

      - name: Node tests
        run: node --test "apps/board/scripts/*.test.mjs" "apps/board/plugins/**/*.test.mjs" "standards/**/*.test.mjs"

      - name: Typecheck
        run: vp run --filter @agent-board/app typecheck

      - name: Unit tests
        working-directory: apps/board
        run: vp test run

      - name: Call capture tests
        run: cargo test --locked --manifest-path apps/board/native/call-capture/Cargo.toml

      - name: Call capture Windows check
        run: cargo check --locked --target x86_64-pc-windows-msvc --manifest-path apps/board/native/call-capture/Cargo.toml

  release:
    name: release
    if: ${{ inputs.version != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@agent-board/app...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: node apps/board/scripts/release.mjs "$VERSION" $PRERELEASE
