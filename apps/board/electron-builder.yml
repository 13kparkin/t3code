appId: com.13kparkin.agentboard
productName: Agent Board
directories:
  output: release
# The renderer and the main process are bundled, so the app ships no node_modules.
files:
  - dist/**/*
  - dist-electron/electron/*.cjs
  - package.json
  - "!node_modules/**/*"
asar: false
# The call capture helper. Main finds it at process.resourcesPath.
extraResources:
  - from: native/call-capture/target/x86_64-pc-windows-msvc/release/agent-board-call-capture.exe
    to: agent-board-call-capture.exe
  - from: native/call-capture/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
# Writes app-update.yml, latest.yml, and the blockmap the in-app updater reads.
publish:
  provider: github
  owner: 13kparkin
  repo: t3code
  releaseType: release
win:
  # The build is unsigned, so the updater must not require a signature.
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch: x64
nsis:
  include: installer.nsh
  artifactName: Agent-Board-Setup-${version}.exe
  createDesktopShortcut: always
  createStartMenuShortcut: true
